# .github/workflows/shadow_crypto.yml
# 72-hour shadow-mode paper trading experiment for the 3-asset crypto
# momentum basket (BTC, ETH, SOL; price_vs_sma50 long-short, crypto
# cost calibration). Hourly tick, state persisted on the shadow-crypto
# branch. After the deadline the tick finalizes the report and disables itself.
name: shadow-crypto

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      deadline_hours:
        description: "Experiment deadline in hours (720 = 30d longrun)"
        default: "72"
  push:
    branches:
      - shadow-crypto

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: shadow-crypto
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shadow-crypto
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install numpy pandas scikit-learn xgboost ta joblib
      - name: Shadow tick
        run: |
          cd quantedge
          python shadow/shadow_run.py --deadline-hours "${{ inputs.deadline_hours || '72' }}" \
            --state-dir shadow-crypto \
            --symbols BTC-USD ETH-USD SOL-USD \
            --feature price_vs_sma50 \
            --spread-fraction 0.0008 \
            --slippage-fraction 0.0004 \
            --commission-per-lot 0.0
      - name: Commit state
        run: |
          git config user.name "quantedge-shadow-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f quantedge/shadow-crypto/
          git diff --cached --quiet && echo "no state change" && exit 0
          git commit -m "shadow: $(date -u +%FT%TZ)"
          git push
      - name: Alert and recover on failure
        if: failure()
        continue-on-error: true
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TITLE="[quantedge-alert] shadow-crypto chain failure"
          gh label create quantedge-alert --color D93F0B --description "autonomous chain failures" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title shadow-crypto" --json number --jq '.[0].number' 2>/dev/null || true)
          BODY="Chain failure at $(date -u +%FT%TZ). Run: $RUN_URL (event ${{ github.event_name }})"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY" --label quantedge-alert
          fi
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "push" ]; then
            curl -sS -f -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/shadow_crypto.yml/dispatches \
              -d '{{"ref":"shadow-crypto"}}' \
              && echo "recovery tick dispatched" || echo "re-dispatch failed; hourly cron remains the safety net"
          else
            echo "manual run failure: re-dispatch skipped"
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
      - name: Bootstrap next tick (cron-independent chain)
        if: success()
        continue-on-error: true
        run: |
          cd quantedge
          FINALIZED=$(python3 -c "import json; print(json.load(open('shadow-crypto/state.json')).get('finalized'))" 2>/dev/null || echo None)
          DEADLINE=$(python3 -c "import json; print(json.load(open('shadow-crypto/state.json')).get('deadline_hours', 72))" 2>/dev/null || echo 72)
          INPUTS='{}'
          if [ "$FINALIZED" = "True" ]; then
            if [ "$DEADLINE" = "72" ]; then
              TS=$(date -u +%Y%m%dT%H%M%SZ)
              mkdir -p shadow-crypto/archive/$TS
              for f in state.json journal.jsonl shadow_report.md; do
                if [ -f "shadow-crypto/$f" ]; then
                  git mv "shadow-crypto/$f" "shadow-crypto/archive/$TS/$f" 2>/dev/null || \
                    mv "shadow-crypto/$f" "shadow-crypto/archive/$TS/$f"
                fi
              done
              git config user.name "quantedge-shadow-bot"
              git config user.email "actions@users.noreply.github.com"
              git add -A shadow-crypto
              git diff --cached --quiet || git commit -m "archive 72h shadow run ($TS); auto-launching 30d longrun"
              git push
              INPUTS='{"deadline_hours":"720"}'
              echo "72h run archived; 30d longrun armed"
            else
              echo "30d longrun finalized; chain stops"
              exit 0
            fi
          fi
          now=$(date +%s)
          next=$(( (now / 3600 + 1) * 3600 + 30 ))
          wait=$(( next - now ))
          echo "sleeping ${wait}s until next hour"
          sleep "$wait"
          curl -sS -f -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/shadow_crypto.yml/dispatches \
            -d "{\"ref\":\"shadow-crypto\",\"inputs\":$INPUTS}" \
            && echo "next tick dispatched"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Disable workflow after deadline
        if: failure() || always()
        continue-on-error: true
        run: |
          cd quantedge
          if grep -q '"finalized": true' shadow-crypto/state.json 2>/dev/null; then
            gh workflow disable shadow-crypto.yml || true
          fi
        env:
          GH_TOKEN: ${{ github.token }}
