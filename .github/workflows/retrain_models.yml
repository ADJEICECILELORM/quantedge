# .github/workflows/retrain_models.yml
# Weekly challenger retraining plus drift check and OOS gate report.
# Models are saved as workflow artifacts and the report is archived on
# the model-artifacts branch. Promotion stays manual (championship.py).
name: retrain-models

on:
  schedule:
    - cron: "5 4 * * 0"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/retrain_models.yml"
      - "quantedge/utils/retrain_job.py"
      - "quantedge/pipeline/inference_pipeline.py"

permissions:
  contents: write
  issues: write

concurrency:
  group: retrain-models
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install numpy pandas scikit-learn xgboost ta joblib
      - name: Retrain challengers
        run: |
          cd quantedge
          python utils/retrain_job.py
      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: quantedge/models/
          retention-days: 90
      - name: Commit report to model-artifacts branch
        run: |
          git config user.name "quantedge-retrain-bot"
          git config user.email "actions@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin model-artifacts >/dev/null 2>&1; then
            git fetch origin model-artifacts --quiet
            git checkout -b model-artifacts origin/model-artifacts
          else
            git checkout --orphan model-artifacts
            git rm -rf --cached . >/dev/null 2>&1 || true
          fi
          git add -f quantedge/models/retrain_report.md quantedge/models/retrain_summary.json quantedge/models/artifacts/
          git diff --cached --quiet && echo "no report change" && exit 0
          git commit -m "model retrain: $(date -u +%FT%TZ)"
          git push -u origin model-artifacts
      - name: Alert on failure
        if: failure()
        continue-on-error: true
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TITLE="[quantedge-alert] retrain-models failure"
          gh label create quantedge-alert --color D93F0B --description "autonomous chain failures" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title retrain-models" --json number --jq '.[0].number' 2>/dev/null || true)
          BODY="Retrain failed at $(date -u +%FT%TZ). Run: $RUN_URL (event ${{ github.event_name }})"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY" --label quantedge-alert
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
