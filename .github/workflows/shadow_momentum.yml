# .github/workflows/shadow_momentum.yml
# 72-hour shadow-mode paper trading experiment for the 3-pair momentum
# basket. Hourly tick, state persisted on the shadow-trading branch.
# After the deadline the tick finalizes the report and disables itself.
name: shadow-momentum

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches:
      - shadow-trading

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: shadow-momentum
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shadow-trading
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install numpy pandas scikit-learn xgboost ta joblib
      - name: Shadow tick
        run: |
          cd quantedge
          python shadow/shadow_run.py --deadline-hours 72
      - name: Commit state
        run: |
          git config user.name "quantedge-shadow-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f quantedge/shadow/
          git diff --cached --quiet && echo "no state change" && exit 0
          git commit -m "shadow: $(date -u +%FT%TZ)"
          git push
      - name: Alert and recover on failure
        if: failure()
        continue-on-error: true
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TITLE="[quantedge-alert] shadow-momentum chain failure"
          gh label create quantedge-alert --color D93F0B --description "autonomous chain failures" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title shadow-momentum" --json number --jq '.[0].number' 2>/dev/null || true)
          BODY="Chain failure at $(date -u +%FT%TZ). Run: $RUN_URL (event ${{ github.event_name }})"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY" --label quantedge-alert
          fi
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "push" ]; then
            curl -sS -f -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/shadow_momentum.yml/dispatches \
              -d '{{"ref":"shadow-trading"}}' \
              && echo "recovery tick dispatched" || echo "re-dispatch failed; hourly cron remains the safety net"
          else
            echo "manual run failure: re-dispatch skipped"
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
      - name: Bootstrap next tick (cron-independent chain)
        if: success()
        continue-on-error: true
        run: |
          cd quantedge
          if grep -q '"finalized": true' shadow/state.json 2>/dev/null; then
            echo "experiment finalized; chain stops"
            exit 0
          fi
          now=$(date +%s)
          next=$(( (now / 3600 + 1) * 3600 + 30 ))
          wait=$(( next - now ))
          echo "sleeping ${wait}s until next hour"
          sleep "$wait"
          curl -sS -f -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/shadow_momentum.yml/dispatches \
            -d '{"ref":"shadow-trading"}' \
            && echo "next tick dispatched"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Disable workflow after deadline
        if: failure() || always()
        continue-on-error: true
        run: |
          cd quantedge
          if grep -q '"finalized": true' shadow/state.json 2>/dev/null; then
            gh workflow disable shadow-momentum.yml || true
          fi
        env:
          GH_TOKEN: ${{ github.token }}
